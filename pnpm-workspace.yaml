# pnpm settings: https://pnpm.io/settings

# Whether each dependency with an install script may run it. A dependency with
# an install script that is not listed fails the install (strictDepBuilds), so
# a new one has to be reviewed and added here. https://pnpm.io/settings#allowbuilds
allowBuilds:
  '@discordjs/opus': true # downloads a prebuilt native Opus binding, or compiles it
  protobufjs: false # via @google/genai; its postinstall only warns about how dependents pin it
  '@parcel/watcher': false # via jest 30, for watch mode; its prebuilt binary comes as an optional dependency, so nothing needs building

# Run the install scripts of the dependencies on every install, rather than
# reuse what an earlier install left in the store. A native binding is built
# or downloaded for the C library of the machine it is installed on, and the
# store, cached in CI, may come from an older Ubuntu: on Ubuntu 26.04 the
# cached @discordjs/opus held only its binding for glibc 2.39, not 2.43.
# https://pnpm.io/settings#sideeffectscache
sideEffectsCache: false
