# pnpm settings: https://pnpm.io/settings

# Dependencies allowed to run install scripts. Any other dependency with an
# install script fails the install (strictDepBuilds), so a new one has to be
# reviewed and added here. https://pnpm.io/settings#allowbuilds
allowBuilds:
  '@discordjs/opus': true # downloads a prebuilt native Opus binding, or compiles it
