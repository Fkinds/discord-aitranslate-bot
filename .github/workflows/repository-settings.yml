# Applies .github/repository-settings.yml to this repository.
#
# - Pull requests that touch the settings get a dry run, which needs no secret.
# - main, the weekly schedule and manual runs apply the settings with a token
#   from this repository's own GitHub App (Repository permission
#   "Administration: Read and write", installed on this repository only).
#   The repo-settings environment, which only main can use, holds the app's
#   Client ID as the variable SETTINGS_APP_CLIENT_ID and its private key as the
#   secret SETTINGS_APP_PRIVATE_KEY. The token is limited to administration,
#   expires within an hour and is revoked when the job ends.
#   https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/making-authenticated-api-requests-with-a-github-app-in-a-github-actions-workflow
name: repository-settings

on:
  pull_request:
    paths:
      - .github/repository-settings.yml
      - .github/workflows/repository-settings.yml
      - scripts/apply-repository-settings.sh
  push:
    branches: [main]
    paths:
      - .github/repository-settings.yml
      - .github/workflows/repository-settings.yml
      - scripts/apply-repository-settings.sh
  schedule:
    - cron: "0 0 * * 1" # Mondays 09:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/apply-repository-settings.sh --dry-run

  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: repo-settings
    concurrency:
      group: repository-settings-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SETTINGS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SETTINGS_APP_PRIVATE_KEY }}
          permission-administration: write
      - run: scripts/apply-repository-settings.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
