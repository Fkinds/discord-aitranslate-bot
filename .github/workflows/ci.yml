# Build and test every pull request and main, and lint the commit messages of
# pull requests. Tests run by size (jest.config.js): small first, then medium
# only once every small job has passed.
#
# The "ci" job is the required status check of the protect-main ruleset
# (.github/repository-settings.yml). Keep its name, and keep this workflow
# running on every pull request (no path filters), or pull requests can't merge.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  small:
    name: small (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every Node.js release line still supported upstream, matching
        # "engines" in package.json. https://github.com/nodejs/Release
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs pnpm (version from "packageManager"), Node.js and the
      # dependencies, failing if pnpm-lock.yaml is missing or out of date.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true
      - run: pnpm lint:layers
      - run: pnpm run build
      - run: pnpm test:small

  medium:
    name: medium (node ${{ matrix.node }})
    needs: [small]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true
      - run: pnpm test:medium

  # Rebase merging puts every commit of a pull request on main as it is, so
  # every one of them has to follow Conventional Commits, not only the title.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true
      - name: Lint every commit message in the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  ci:
    if: always()
    needs: [small, medium, commitlint]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed (commitlint runs on pull requests only)
        env:
          EVENT: ${{ github.event_name }}
          SMALL: ${{ needs.small.result }}
          MEDIUM: ${{ needs.medium.result }}
          COMMITLINT: ${{ needs.commitlint.result }}
        run: |
          test "$SMALL" = success
          test "$MEDIUM" = success
          if [ "$EVENT" = pull_request ]; then
            test "$COMMITLINT" = success
          else
            test "$COMMITLINT" = skipped
          fi
